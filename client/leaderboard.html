<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Heist — High scores</title>
    <!-- Type, color, and the stage texture come from Deepgram's brand UI kit
         (/vdui/brand.css, copied from @deepgram-devs/dg-brand-ui).

         Layout: gamer-first, own-device viewing. Today's race is the hero
         (live, score bars, badges, YOU highlight); the all-time podium and the
         latest-cracks pulse ride the side rail; previous days demote to a
         compact history strip. -->
    <link rel="stylesheet" href="/vdui/brand.css" />
    <style>
      /* Page roles on kit tokens. Gold, silver, and bronze are the podium's
         medals (game art); gold is the kit's yellow. */
      :root {
        color-scheme: dark;
        --line: rgb(255 255 255 / .12);
        --text: var(--color-paper); --muted: rgb(252 250 248 / .8);
        --good: var(--color-lime); --mine: var(--color-magenta);
        --gold: var(--color-yellow); --silver: #c9d4e4; --bronze: #e0a35c;
      }
      * { box-sizing:border-box; }
      html { background:var(--color-ink); }
      html, body { margin:0; min-height:100vh; }
      body {
        color:var(--text); font:16px/1.5 var(--font-sans);
        padding:clamp(18px,3vw,44px); overflow-x:hidden;
        background:var(--color-ink) url("/vdui/textures/stage.webp") center / cover no-repeat fixed;
      }
      .label { letter-spacing:.08em; }

      .head { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:clamp(18px,2.4vw,30px); flex-wrap:wrap; }
      .brand { color:var(--text); font-size:.85rem; }
      .brand .dot { color:var(--good); }
      .title { font-family:var(--font-sans); font-weight:600; margin:0; font-size:clamp(26px,5vw,56px); line-height:1.1; }
      .updated { color:var(--muted); }
      /* The kit's CTA: magenta pill, label type. Only one on screen: when the
         empty state shows its own, the header's steps down to a ghost pill. */
      .play-link { display:inline-flex; align-items:center; gap:.5rem; height:3rem; padding:0 1.5rem;
        color:var(--color-ink); background:var(--color-magenta); border:2px solid rgb(255 255 255 / .25);
        border-radius:999px; text-decoration:none; box-shadow:0 0 40px -6px rgb(224 66 255 / .7); }
      .play-link:hover { filter:brightness(1.1); }
      .play-link:focus-visible { outline:2px solid var(--color-magenta); outline-offset:4px; }
      body:has(.today-cta) .head .play-link { background:transparent; color:var(--text);
        border:1px solid rgb(255 255 255 / .3); box-shadow:none; }

      .grid { display:grid; grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr); gap:clamp(14px,1.8vw,26px); align-items:start; }
      .side { display:grid; gap:clamp(14px,1.8vw,26px); min-width:0; }
      @media (max-width:920px) { .grid { grid-template-columns:minmax(0,1fr); } }

      /* Panels are the kit's glass on the stage */
      .panel { background:rgb(255 255 255 / .05); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
        border:1px solid rgb(255 255 255 / .1); border-radius:1.5rem; padding:clamp(14px,1.6vw,24px);
        position:relative; overflow:hidden; animation:var(--animate-rise); min-width:0; }
      .panel-head { display:flex; align-items:baseline; gap:10px; margin-bottom:14px; padding-bottom:10px;
        border-bottom:1px solid var(--line); }
      .live { color:var(--good); }
      .reset-inline { margin-left:auto; color:var(--gold); white-space:nowrap; }

      /* ---- Today's race (hero) ---- */
      .trow { display:grid; grid-template-columns:46px minmax(0,1fr) auto; gap:12px; align-items:center;
        padding:10px 12px; border-radius:12px; background:rgb(0 0 0 / .25); border:1px solid transparent; }
      .trow + .trow { margin-top:7px; }
      .trank { font-family:var(--font-mono); font-weight:600; font-size:18px; text-align:center; color:var(--muted); }
      .trow[data-rank="1"] .trank, .trow[data-rank="2"] .trank, .trow[data-rank="3"] .trank { font-size:24px; }
      .tmain { min-width:0; }
      .tname { font-weight:600; font-size:clamp(14px,1.5vw,18px); display:flex; align-items:center; min-width:0; white-space:nowrap; }
      .tname .nm { overflow:hidden; text-overflow:ellipsis; }
      .bdg { margin-left:7px; font-size:13px; }
      .you { margin-left:8px; color:var(--mine); }
      .tbar { height:5px; border-radius:3px; margin-top:7px; overflow:hidden; background:rgb(124 217 65 / .12); }
      .tbar i { display:block; height:100%; border-radius:3px; width:var(--w); background:var(--good); animation:barIn .9s ease-out both; }
      .tscore { font-family:var(--font-mono); font-weight:600; font-size:clamp(15px,1.7vw,21px); color:var(--good); }
      .trow.first { border-color:rgb(247 243 0 / .5); background:rgb(247 243 0 / .07); }
      .trow.first .tname, .trow.first .tscore { color:var(--gold); }
      .trow.first .tbar i { background:var(--gold); }
      .trow.mine { border-color:rgb(224 66 255 / .55); background:rgb(224 66 255 / .09); }
      /* A row that climbed since the last poll glows once, the kit's glow. */
      .trow.up-flash { animation:var(--animate-glow); }
      .tdivider { text-align:center; color:var(--muted); font-size:11px; padding:5px 0; user-select:none; }
      .today-empty { padding:30px 10px 24px; text-align:center; color:var(--muted); font-size:16px; line-height:1.8; }

      /* ---- All-time best (podium) ---- */
      .podium { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; align-items:end; }
      .pstep { text-align:center; min-width:0; }
      .pcrown { font-size:16px; height:20px; }
      .pmedal { width:46px; height:46px; margin:0 auto 6px; border-radius:50%;
        display:flex; align-items:center; justify-content:center;
        font-family:var(--font-mono); font-weight:600; font-size:15px;
        background:rgb(0 0 0 / .25); border:2px solid var(--line); color:var(--muted); }
      .pstep.g1 .pmedal { border-color:var(--gold); color:var(--gold); }
      .pstep.g2 .pmedal { border-color:var(--silver); color:var(--silver); }
      .pstep.g3 .pmedal { border-color:var(--bronze); color:var(--bronze); }
      .pname { font-size:12px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .pscore { font-family:var(--font-mono); font-weight:600; font-size:14px; color:var(--good); }
      .pstep.g1 .pscore { color:var(--gold); }
      .pdate { font-size:11px; color:var(--muted); font-family:var(--font-mono); }
      .pblock { margin-top:8px; border-radius:8px 8px 0 0; border:1px solid var(--line); border-bottom:none;
        display:flex; align-items:center; justify-content:center;
        font-family:var(--font-mono); font-weight:600; color:var(--muted); font-size:15px;
        background:rgb(0 0 0 / .2); }
      .pstep.g1 .pblock { height:54px; border-color:rgb(247 243 0 / .45); color:var(--gold); }
      .pstep.g2 .pblock { height:36px; }
      .pstep.g3 .pblock { height:26px; }
      .pstep.ghost { opacity:.55; }

      /* ---- Latest cracks (pulse) ---- */
      .prow { display:flex; gap:7px; align-items:baseline; padding:8px 2px; font-size:13px; min-width:0;
        border-bottom:1px solid var(--line); }
      .prow:last-child { border-bottom:none; }
      .pwho { font-weight:600; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .pverb { color:var(--muted); flex-shrink:0; }
      .pheist { font-weight:600; white-space:nowrap; }
      .pplus { color:var(--good); font-family:var(--font-mono); font-weight:600; font-size:12px; flex-shrink:0; }
      .pago { margin-left:auto; color:var(--muted); font-size:11px; flex-shrink:0; }
      .pulse-empty { color:var(--muted); font-size:13px; padding:6px 2px; }

      /* ---- Previous days (compact history) ---- */
      .history { margin-top:clamp(16px,2vw,26px); }
      .history-head { color:var(--muted); margin-bottom:10px; }
      .hgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:12px; }
      .hday { background:rgb(255 255 255 / .05); border:1px solid rgb(255 255 255 / .1); border-radius:1rem; padding:14px; }
      .hdate { margin-bottom:8px; color:var(--muted); }
      .hrow { display:flex; gap:8px; align-items:center; font-size:13px; padding:3px 0; min-width:0; }
      .hrank { width:22px; text-align:center; flex-shrink:0; }
      .hname { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .hrow.mine .hname { color:var(--mine); }
      .hscore { font-family:var(--font-mono); font-weight:600; color:var(--good); font-size:12px; flex-shrink:0; }
      .hmore { margin-top:6px; color:var(--muted); }

      .empty, .loading { color:var(--muted); text-align:center; padding:40px 0; }
      .foot { margin-top:30px; text-align:center; color:var(--muted); font-size:clamp(14px,1.4vw,16px); }
      .foot a { color:var(--text); }
      .powered-by { margin-top:16px; text-align:center; font-family:var(--font-mono);
        font-size:12px; color:var(--muted); }
      .powered-by span { color:var(--good); }

      @keyframes barIn { from { width:0; } }
    </style>
  </head>
  <body>
    <div class="head">
      <div class="brand label"><span class="dot">&#9673;</span> Voice Heist</div>
      <h1 class="title">High scores</h1>
      <a class="play-link label" href="/game">&#9654; Play now</a>
      <div class="updated label" id="updated">Loading…</div>
    </div>

    <div class="grid">
      <!-- The hero: today's live race, score bars relative to the leader. -->
      <section class="panel today">
        <div class="panel-head label">Today’s race <span class="live">&#9679; Live</span><span class="reset-inline" id="reset"></span></div>
        <div id="todayRows"><p class="loading label">Loading…</p></div>
      </section>

      <aside class="side">
        <section class="panel">
          <div class="panel-head label">All-time best</div>
          <div id="podium" class="podium"></div>
        </section>
        <!-- Proof of other humans: the day's latest cracks. -->
        <section class="panel">
          <div class="panel-head label">Latest cracks</div>
          <div id="pulse"></div>
        </section>
      </aside>
    </div>

    <section class="history" id="historyWrap" hidden>
      <div class="history-head label">Previous days</div>
      <div class="hgrid" id="history"></div>
    </section>

    <p class="foot">&#9654; Talk your way past the AI &middot; top the board &middot; each week's top heister takes the Mastermind's Cut (the weekly prize) &middot; <a href="/rules">rules</a></p>
    <div class="powered-by">Powered by <img src="/vdui/logos/deepgram.svg" alt="Deepgram" style="height:14px;width:auto;vertical-align:middle" /> <span>Voice Agent API</span></div>
    <script type="module" src="/src/leaderboard.js"></script>
  </body>
</html>
